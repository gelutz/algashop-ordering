spring:
  application:
    name: ordering
  datasource:
    url: jdbc:h2:mem:ordering-test;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;
    username: sa
    password: '123'
  h2:
    console:
      enabled: 'true'
      settings.web-allow-others: 'true'
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: 'true'

algashop:
  integrations:
    shipping:
      provider: "FAKE" # RAPIDEX | FAKE
      wiremock.port: 8087
      rapidex.url: "http://localhost:${algashop.integrations.shipping.wiremock.port}"
    product-catalog:
      provider: "HTTP" # HTTP | FAKE
      wiremock.port: 8187
      url: "http://localhost:${algashop.integrations.product-catalog.wiremock.port}"
